apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: redis
  namespace: argocd
spec:
  project: default

  sources:
    - repoURL: https://ot-container-kit.github.io/helm-charts
      chart: redis-operator
      targetRevision: 0.26.1
      helm:
        releaseName: redis-operator
        valueFiles:
          - $values/infra/redis/values.yaml
    - repoURL: https://github.com/cine-org/cinema-ops.git
      targetRevision: main
      path: infra/redis/envs/staging
      ref: values

  destination:
    server: https://kubernetes.default.svc
    namespace: redis-operator

  syncPolicy:
    automated:
      enabled: true
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
