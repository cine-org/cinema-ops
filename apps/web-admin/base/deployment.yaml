apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-admin
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: web-admin
  template:
    metadata:
      labels:
        app.kubernetes.io/name: web-admin
    spec:
      # Service env vars of the namespace are not needed and may clash with app env names.
      enableServiceLinks: false
      imagePullSecrets:
        - name: ghcr-pull
      securityContext:
        runAsNonRoot: true
        # The image sets USER node by name; kubelet needs the numeric id to verify non-root.
        runAsUser: 1000
      containers:
        - name: web-admin
          image: ghcr.io/cine-org/cinema/web-admin
          ports:
            - name: http
              containerPort: 3000
          env:
            # Next.js binds to HOSTNAME; the pod name would limit it to the pod IP.
            - name: HOSTNAME
              value: 0.0.0.0
          envFrom:
            # Env-specific settings (envs/<env>/kustomization.yaml).
            - configMapRef:
                name: web-admin-config
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
          resources:
            requests:
              cpu: 20m
              memory: 96Mi
            limits:
              memory: 256Mi
