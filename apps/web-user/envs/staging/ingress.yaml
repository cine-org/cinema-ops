apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: web-user
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - staging.cine.io.vn
      secretName: staging-cine-io-vn-tls
  rules:
    - host: staging.cine.io.vn
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web-user
                port:
                  name: http
