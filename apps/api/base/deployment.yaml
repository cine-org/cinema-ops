apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      securityContext:
        runAsNonRoot: true
        # The image sets USER node by name; kubelet needs the numeric id to verify non-root.
        runAsUser: 1000
      containers:
        - name: api
          image: ghcr.io/cine-org/cinema/api
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            # Env-specific settings (envs/<env>/kustomization.yaml).
            - configMapRef:
                name: api-config
            - secretRef:
                name: api-db
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 384Mi
