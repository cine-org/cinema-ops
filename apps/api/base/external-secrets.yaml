# Runtime connection strings: cinema_rw for writes, cinema_ro for reads. Never the owner role.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: api-db
  annotations:
    # The CRD may not exist yet when a new cluster syncs apps before infra.
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-manager
    kind: ClusterSecretStore
  target:
    name: api-db
    template:
      data:
        DATABASE_URL: "postgresql://cinema_rw:{{ .rw }}@postgres-rw.infra.svc:5432/cinema"
        # One instance: postgres-r reaches the primary; postgres-ro only reaches replicas.
        DATABASE_URL_RO: "postgresql://cinema_ro:{{ .ro }}@postgres-r.infra.svc:5432/cinema"
  data:
    - secretKey: rw
      remoteRef:
        key: infra-postgres-rw
    - secretKey: ro
      remoteRef:
        key: infra-postgres-ro
