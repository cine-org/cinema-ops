# REDIS_URL for rate limiting. Staging only until production has Redis (infra/redis).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: api-redis
  annotations:
    # The CRD may not exist yet when a new cluster syncs apps before infra.
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-manager
    kind: ClusterSecretStore
  target:
    name: api-redis
    template:
      data:
        # The password is hex, so it goes into the URL as is.
        REDIS_URL: "redis://:{{ .password }}@redis-master.infra.svc:6379/0"
  data:
    - secretKey: password
      remoteRef:
        key: infra-redis
