apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: cinema
resources:
  - ../../base
  - ingress.yaml
  - external-secret-redis.yaml
# Appends to envFrom: a strategic merge would replace the whole list.
patches:
  - target:
      kind: Deployment
      name: api
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/envFrom/-
        value:
          secretRef:
            name: api-redis
# The cinema release bot edits newTag (cinema: .github/actions/ops-pr).
images:
  - name: ghcr.io/cine-org/cinema/api
    newTag: sha-d5a1b6f
# The hash suffix restarts the api when a value changes.
configMapGenerator:
  - name: api-config
    literals:
      - API_ORIGIN=https://api.staging.cine.io.vn
      - CORS_ORIGINS=https://staging.cine.io.vn,https://admin.staging.cine.io.vn
      - ENABLE_SWAGGER=true
      - LOG_LEVEL=log
      # Traefik is the only proxy in front of the api.
      - TRUST_PROXY=1
