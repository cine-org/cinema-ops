# Auth keys and the SMTP password. Staging only until production has the same GSM secrets.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: api-auth
  annotations:
    # The CRD may not exist yet when a new cluster syncs apps before infra.
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-manager
    kind: ClusterSecretStore
  target:
    name: api-auth
  data:
    - secretKey: AUTH_OTP_HMAC_KEY
      remoteRef:
        key: cinema-auth-otp-hmac-key
    - secretKey: AUTH_JWT_SECRET
      remoteRef:
        key: cinema-auth-jwt-secret
    - secretKey: SMTP_PASSWORD
      remoteRef:
        key: cinema-smtp-password
