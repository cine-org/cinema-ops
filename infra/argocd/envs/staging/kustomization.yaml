apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base

# The only place naming the env.
patches:
  - target:
      kind: ApplicationSet
      name: infra
    patch: |
      - op: replace
        path: /spec/generators/0/matrix/generators/0/git/directories/0/path
        value: infra/*/envs/staging
      - op: replace
        path: /spec/generators/0/matrix/generators/0/git/directories/1/path
        value: infra/argocd/envs/staging
  - target:
      kind: ApplicationSet
      name: apps
    patch: |
      - op: replace
        path: /spec/generators/0/git/directories/0/path
        value: apps/*/envs/staging
