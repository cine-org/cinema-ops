# Takes over the key of the repo credential created by hand at bootstrap; rotating it only needs GSM.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cinema-ops-repo
  namespace: argocd
  annotations:
    # The CRD arrives later with the external-secrets app.
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-manager
    kind: ClusterSecretStore
  target:
    name: cinema-ops-repo
    creationPolicy: Merge
  data:
    - secretKey: githubAppPrivateKey
      remoteRef:
        key: infra-argocd-github-app
---
# Webhook secret merged into the chart-owned argocd-secret.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: argocd-webhook
  namespace: argocd
  annotations:
    # The CRD arrives later with the external-secrets app.
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-manager
    kind: ClusterSecretStore
  target:
    name: argocd-secret
    creationPolicy: Merge
  data:
    - secretKey: webhook.github.secret
      remoteRef:
        key: infra-argocd-webhook
---
# GitHub App key for commit statuses; the chart does not create this secret (notifications.secret.create: false).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: argocd-notifications-secret
  namespace: argocd
  annotations:
    # The CRD arrives later with the external-secrets app.
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-manager
    kind: ClusterSecretStore
  target:
    name: argocd-notifications-secret
  data:
    - secretKey: github-privateKey
      remoteRef:
        key: infra-argocd-github-app
