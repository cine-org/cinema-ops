apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: infra-redis
  namespace: infra
  annotations:
    # Before the RedisReplication: the operator needs the password to start Redis.
    argocd.argoproj.io/sync-wave: "1"
    # The CRD arrives later with the external-secrets app.
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-manager
    kind: ClusterSecretStore
  target:
    name: infra-redis
  data:
    - secretKey: password
      remoteRef:
        key: infra-redis
