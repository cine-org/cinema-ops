apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres
  namespace: infra
  annotations:
    # After the operator chart (wave 0) and the password secrets (wave 1).
    argocd.argoproj.io/sync-wave: "2"
spec:
  instances: 1

  bootstrap:
    initdb:
      database: cinema
      owner: cinema
      secret:
        name: infra-postgres

  managed:
    roles:
      - name: cinema_rw
        ensure: present
        login: true
        inherit: true
        connectionLimit: -1
        passwordSecret:
          name: infra-postgres-rw
        inRoles:
          - pg_read_all_data
          - pg_write_all_data

      - name: cinema_ro
        ensure: present
        login: true
        inherit: true
        connectionLimit: -1
        passwordSecret:
          name: infra-postgres-ro
        inRoles:
          - pg_read_all_data

  # Continuous WAL archiving to the ObjectStore in backup.yaml.
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      # Default, but the CNPG webhook fills it in; declared to stay in sync.
      enabled: true
      isWALArchiver: true
      parameters:
        barmanObjectName: gcs

  storage:
    size: 5Gi

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi
