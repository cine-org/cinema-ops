# Owner of database cinema, created by bootstrap.initdb; used only for migrations.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: infra-postgres
  namespace: infra
  annotations:
    # Before the Cluster: on an empty cluster these fail until the ESO webhook runs, and the sync
    # stops here and retries instead of leaving the Cluster waiting for its passwords.
    argocd.argoproj.io/sync-wave: "1"
    # The CRD arrives later with the external-secrets app.
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-manager
    kind: ClusterSecretStore
  target:
    name: infra-postgres
    template:
      type: kubernetes.io/basic-auth
      data:
        # CNPG requires username to equal the role name; it is not secret, so it stays in git.
        username: cinema
        password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: infra-postgres
---
# Runtime role of the api: read and write rows, no DDL.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: infra-postgres-rw
  namespace: infra
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    # The CRD arrives later with the external-secrets app.
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-manager
    kind: ClusterSecretStore
  target:
    name: infra-postgres-rw
    template:
      type: kubernetes.io/basic-auth
      data:
        # CNPG requires username to equal the role name; it is not secret, so it stays in git.
        username: cinema_rw
        password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: infra-postgres-rw
---
