apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base

# The bucket of this env (docs/gcp/gcs.md).
patches:
  - target:
      kind: ObjectStore
      name: gcs
    patch: |
      - op: replace
        path: /spec/configuration/destinationPath
        value: gs://cinema-staging-pg-backup
