apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: web-admin
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/cine-org/cinema-ops.git
    targetRevision: main
    path: k8s/environments/staging/apps/web-admin

  destination:
    server: https://kubernetes.default.svc
    namespace: cinema

  syncPolicy:
    automated:
      enabled: true
      prune: true
      selfHeal: true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
